[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrition-bot"

description = "Telegram-бот для учёта питания и подсчёта КБЖУ"
authors = [{name = "NutritionBot"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
